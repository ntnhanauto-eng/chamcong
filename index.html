<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HVS Quản Lý Công - Boss</title>
    <style>
        :root { --green-bg: #c6e0b4; --yellow-bg: #ffe699; --orange-bg: #f8cbad; --border-color: #444; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 8px; background-color: #f0f2f5; font-size: 13px; }
        .container { max-width: 100%; margin: auto; background: white; padding: 12px; border-radius: 8px; }
        
        .setup-section { background: #f8f9fa; padding: 8px; border-radius: 6px; margin-bottom: 12px; display: flex; gap: 10px; border: 1px solid #ddd; }
        select, input { padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 15px; }

        .table-responsive { width: 100%; overflow-x: auto; margin-bottom: 12px; border: 1px solid var(--border-color); }
        table { width: 100%; min-width: 360px; border-collapse: collapse; table-layout: fixed; }
        th, td { border: 1px solid var(--border-color); text-align: center; padding: 4px 1px; }
        
        .header-green { background-color: var(--green-bg); font-weight: bold; font-size: 11px; }
        .label-cell { text-align: left; padding-left: 5px; font-weight: bold; width: 65px; background: #fdfdfd; }
        .total-cell { background-color: #eee; font-weight: bold; width: 45px; }
        .sun-column { background-color: #fff0f0; color: red; }

        input.cell-input { width: 100%; border: none; text-align: center; font-size: 16px; outline: none; background: transparent; font-weight: bold; padding: 2px 0; }

        .summary-wrapper { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; border-top: 2px solid #eee; padding-top: 15px; }
        .salary-table { width: 100%; border: 1px solid var(--border-color); }
        .salary-table input { border: none; text-align: right; font-weight: bold; font-size: 15px; background: #fffdf0; width: 100%; padding: 4px; box-sizing: border-box; }
        .salary-table td { padding: 8px; border: 1px solid #ddd; }
        
        .btn-save { background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; width: 100%; font-size: 16px; cursor: pointer; }
        .final-row { background-color: var(--yellow-bg); font-weight: bold; font-size: 1.15em; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin: 0 0 10px 0; font-size: 1.1rem;">BẢNG CÔNG & LƯƠNG HVS</h2>

    <div class="setup-section">
        <select id="month-select" onchange="renderCalendar()" style="flex:2"></select>
        <input type="number" id="year-select" value="2026" onchange="renderCalendar()" style="flex:1">
    </div>

    <div id="calendar-content"></div>

    <div class="summary-wrapper">
        <button class="btn-save" onclick="saveData()">LƯU DỮ LIỆU NHẬP</button>
        
        <table style="width: 100%;">
            <tr><td class="label-cell" style="background:var(--green-bg)">Thường</td><td id="res-thuong" style="font-weight:bold; text-align:right; padding-right:10px">0</td></tr>
            <tr><td class="label-cell" style="background:var(--orange-bg)">OVT</td><td id="res-ovt" style="font-weight:bold; text-align:right; padding-right:10px">0</td></tr>
            <tr><td class="label-cell" style="background:var(--yellow-bg)">CN</td><td id="res-cn" style="font-weight:bold; text-align:right; padding-right:10px">0</td></tr>
        </table>

        <table class="salary-table">
            <tr><td class="label-cell" style="width:120px">LCB</td><td><input type="number" id="in-lcb" value="11110000" oninput="calculate()"></td></tr>
            <tr><td class="label-cell">Lương giờ</td><td id="lbl-luong-gio">0</td></tr>
            <tr><td class="label-cell">Thêm giờ (OVT)</td><td id="lbl-ovt-money">0</td></tr>
            <tr><td class="label-cell">PC Chức vụ</td><td><input type="number" id="in-pc-chucvu" value="1600000" oninput="calculate()"></td></tr>
            <tr><td class="label-cell">PC C.Việc</td><td><input type="number" id="in-pc-congviec" value="750000" oninput="calculate()"></td></tr>
            <tr><td class="label-cell">PC Thâm niên</td><td><input type="number" id="in-pc-thamnien" value="590000" oninput="calculate()"></td></tr>
            <tr><td class="label-cell">BHXH (8%)</td><td id="lbl-bhxh">0</td></tr>
            <tr><td class="label-cell">BHYT (1.5%)</td><td id="lbl-bhyt">0</td></tr>
            <tr><td class="label-cell">BHTN (1%)</td><td id="lbl-bhtn">0</td></tr>
            <tr class="final-row">
                <td class="label-cell">THỰC NHẬN</td>
                <td id="lbl-total" style="color: #d9534f;">0</td>
            </tr>
        </table>
    </div>
</div>

<script>
    const daysOfWeek = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"];

    function init() {
        const monthSel = document.getElementById('month-select');
        for(let i=0; i<12; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.text = "Tháng " + (i+1);
            monthSel.add(opt);
        }
        monthSel.value = new Date().getMonth();
        renderCalendar();
    }

    function renderCalendar() {
        const month = parseInt(document.getElementById('month-select').value);
        const year = parseInt(document.getElementById('year-select').value);
        const container = document.getElementById('calendar-content');
        container.innerHTML = '';

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0).getDate();
        let startPos = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

        let dayCounter = 1;
        while (dayCounter <= lastDay) {
            let wrap = document.createElement('div');
            wrap.className = 'table-responsive';
            let table = document.createElement('table');
            let hRow = `<tr class="header-green"><td class="label-cell">Thứ</td>`, 
                dRow = `<tr class="header-green"><td class="label-cell">Ngày</td>`, 
                tRow = `<tr><td class="label-cell">Thường</td>`, 
                oRow = `<tr><td class="label-cell">OVT</td>`,
                cRow = `<tr><td class="label-cell">CN</td>`;
            
            for (let i = 0; i < 7; i++) {
                let isSun = (i === 6);
                hRow += `<td class="${isSun ? 'sun-column' : ''}">${daysOfWeek[i]}</td>`;
                if ((dayCounter === 1 && i < startPos) || dayCounter > lastDay) {
                    dRow += '<td></td>'; tRow += '<td></td>'; oRow += '<td></td>'; cRow += '<td></td>';
                } else {
                    dRow += `<td class="${isSun ? 'sun-column' : ''}">${dayCounter}</td>`;
                    if (isSun) {
                        tRow += `<td class="sun-column"></td>`; // Thường của CN để trống
                        oRow += `<td class="sun-column"></td>`; // OVT của CN để trống
                        cRow += `<td class="sun-column"><input type="number" class="cell-input in-c" data-day="${dayCounter}" oninput="calculate()"></td>`;
                    } else {
                        tRow += `<td><input type="number" class="cell-input in-t" data-day="${dayCounter}" oninput="calculate()"></td>`;
                        oRow += `<td><input type="number" class="cell-input in-o" data-day="${dayCounter}" oninput="calculate()"></td>`;
                        cRow += `<td></td>`;
                    }
                    dayCounter++;
                }
            }
            hRow += '<td class="total-cell">TỔNG</td></tr>'; dRow += '<td></td></tr>';
            tRow += '<td class="total-cell w-t">0</td></tr>'; oRow += '<td class="total-cell w-o">0</td></tr>';
            cRow += '<td class="total-cell w-c">0</td></tr>';
            
            table.innerHTML = hRow + dRow + tRow + oRow + cRow;
            wrap.appendChild(table);
            container.appendChild(wrap);
            startPos = 0;
        }
        loadSavedData(); calculate();
    }

    function calculate() {
        let totalT = 0, totalO = 0, totalC = 0;
        document.querySelectorAll('table').forEach(tbl => {
            if(tbl.parentElement.className === 'table-responsive') {
                let wt = 0, wo = 0, wc = 0;
                tbl.querySelectorAll('.in-t').forEach(i => wt += Number(i.value) || 0);
                tbl.querySelectorAll('.in-o').forEach(i => wo += Number(i.value) || 0);
                tbl.querySelectorAll('.in-c').forEach(i => wc += Number(i.value) || 0);
                tbl.querySelector('.w-t').innerText = wt;
                tbl.querySelector('.w-o').innerText = wo;
                tbl.querySelector('.w-c').innerText = wc;
                totalT += wt; totalO += wo; totalC += wc;
            }
        });

        document.getElementById('res-thuong').innerText = totalT;
        document.getElementById('res-ovt').innerText = totalO;
        document.getElementById('res-cn').innerText = totalC;

        const lcb = Number(document.getElementById('in-lcb').value) || 0;
        const pccv = Number(document.getElementById('in-pc-chucvu').value) || 0;
        const pctn = Number(document.getElementById('in-pc-thamnien').value) || 0;
        const pccviec = Number(document.getElementById('in-pc-congviec').value) || 0;

        const luongGio = Math.round(lcb / 208);
        const tienOvt = Math.round(totalO * luongGio * 1.5);
        const tienCn = Math.round(totalC * luongGio * 2.0); // Giả định CN hệ số 2.0
        
        const bhxh = Math.round(lcb * 0.08);
        const bhyt = Math.round(lcb * 0.015);
        const bhtn = Math.round(lcb * 0.01);

        const final = (lcb + tienOvt + tienCn + pccv + pctn + pccviec) - (bhxh + bhyt + bhtn);

        document.getElementById('lbl-luong-gio').innerText = luongGio.toLocaleString();
        document.getElementById('lbl-ovt-money').innerText = (tienOvt + tienCn).toLocaleString();
        document.getElementById('lbl-bhxh').innerText = bhxh.toLocaleString();
        document.getElementById('lbl-bhyt').innerText = bhyt.toLocaleString();
        document.getElementById('lbl-bhtn').innerText = bhtn.toLocaleString();
        document.getElementById('lbl-total').innerText = final.toLocaleString() + " ₫";
    }

    function saveData() {
        const month = document.getElementById('month-select').value;
        const year = document.getElementById('year-select').value;
        const data = { thuong: {}, ovt: {}, cn: {}, salary: {} };
        document.querySelectorAll('.in-t').forEach(i => { if(i.dataset.day) data.thuong[i.dataset.day] = i.value });
        document.querySelectorAll('.in-o').forEach(i => { if(i.dataset.day) data.ovt[i.dataset.day] = i.value });
        document.querySelectorAll('.in-c').forEach(i => { if(i.dataset.day) data.cn[i.dataset.day] = i.value });
        data.salary = { lcb: document.getElementById('in-lcb').value, pccv: document.getElementById('in-pc-chucvu').value, pccviec: document.getElementById('in-pc-congviec').value, pctn: document.getElementById('in-pc-thamnien').value };
        localStorage.setItem(`hvs_data_${year}_${month}`, JSON.stringify(data));
        alert("Đã lưu dữ liệu thành công!");
    }

    function loadSavedData() {
        const month = document.getElementById('month-select').value;
        const year = document.getElementById('year-select').value;
        const saved = localStorage.getItem(`hvs_data_${year}_${month}`);
        if (saved) {
            const data = JSON.parse(saved);
            document.querySelectorAll('.in-t').forEach(i => { if(data.thuong[i.dataset.day]) i.value = data.thuong[i.dataset.day] });
            document.querySelectorAll('.in-o').forEach(i => { if(data.ovt[i.dataset.day]) i.value = data.ovt[i.dataset.day] });
            document.querySelectorAll('.in-c').forEach(i => { if(data.cn[i.dataset.day]) i.value = data.cn[i.dataset.day] });
            if(data.salary) {
                document.getElementById('in-lcb').value = data.salary.lcb;
                document.getElementById('in-pc-chucvu').value = data.salary.pccv;
                document.getElementById('in-pc-congviec').value = data.salary.pccviec;
                document.getElementById('in-pc-thamnien').value = data.salary.pctn;
            }
        }
    }
    window.onload = init;
</script>
</body>
</html>
