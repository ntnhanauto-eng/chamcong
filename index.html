<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng Nhập Công - Boss</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; text-align: center; }
        th, td { border: 1px solid #333; padding: 8px; width: 10%; }
        .header-green { background-color: #c6e0b4; font-weight: bold; }
        .label-cell { background-color: #ffffff; text-align: left; padding-left: 10px; font-weight: bold; }
        .total-cell { background-color: #f2f2f2; font-weight: bold; }
        .summary-table { width: 200px; float: right; }
        .summary-header { background-color: #ffe699; }
        input { width: 90%; border: none; text-align: center; font-size: 16px; outline: none; }
        input:focus { background-color: #fff9c4; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">BẢNG CHẤM CÔNG HÀNG THÁNG</h2>

    <table id="week1">
        <tr class="header-green">
            <td colspan="1"></td><td>CN</td><td></td><td></td><td></td><td></td><td></td><td>T7</td><td rowspan="2">TỔNG</td>
        </tr>
        <tr class="header-green">
            <td>Ngày</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td>
        </tr>
        <tr>
            <td class="label-cell">Thường</td>
            <td><input type="number" class="thuong" data-week="1"></td>
            <td><input type="number" class="thuong" data-week="1"></td>
            <td><input type="number" class="thuong" data-week="1"></td>
            <td><input type="number" class="thuong" data-week="1"></td>
            <td><input type="number" class="thuong" data-week="1"></td>
            <td><input type="number" class="thuong" data-week="1"></td>
            <td><input type="number" class="thuong" data-week="1"></td>
            <td class="total-cell" id="total-thuong-1">0</td>
        </tr>
        <tr>
            <td class="label-cell">OVT</td>
            <td><input type="number" class="ovt" data-week="1"></td>
            <td><input type="number" class="ovt" data-week="1"></td>
            <td><input type="number" class="ovt" data-week="1"></td>
            <td><input type="number" class="ovt" data-week="1"></td>
            <td><input type="number" class="ovt" data-week="1"></td>
            <td><input type="number" class="ovt" data-week="1"></td>
            <td><input type="number" class="ovt" data-week="1"></td>
            <td class="total-cell" id="total-ovt-1">0</td>
        </tr>
    </table>

    <table class="summary-table">
        <tr><td class="summary-header">Thường</td><td id="final-thuong">0</td></tr>
        <tr><td class="summary-header" style="background-color: #f8cbad;">OVT</td><td id="final-ovt">0</td></tr>
        <tr><td class="summary-header" style="background-color: #ffd966;">CN</td><td id="final-cn">0</td></tr>
    </table>
    <div style="clear: both;"></div>
</div>

<script>
    const inputs = document.querySelectorAll('input');
    
    inputs.forEach(input => {
        input.addEventListener('input', () => {
            calculateTotals();
        });
    });

    function calculateTotals() {
        let grandThuong = 0;
        let grandOvt = 0;

        // Tính cho tuần 1 (Boss có thể copy code JS này cho các tuần tiếp theo)
        let week1Thuong = 0;
        document.querySelectorAll('.thuong[data-week="1"]').forEach(i => week1Thuong += Number(i.value) || 0);
        document.getElementById('total-thuong-1').innerText = week1Thuong;

        let week1Ovt = 0;
        document.querySelectorAll('.ovt[data-week="1"]').forEach(i => week1Ovt += Number(i.value) || 0);
        document.getElementById('total-ovt-1').innerText = week1Ovt;

        // Cập nhật bảng tổng kết cuối
        document.getElementById('final-thuong').innerText = week1Thuong; // + các tuần khác
        document.getElementById('final-ovt').innerText = week1Ovt; // + các tuần khác
    }
</script>

</body>
</html>
