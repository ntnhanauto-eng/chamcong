<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Tính Công & Lương - Boss</title>
    <style>
        :root {
            --green-bg: #c6e0b4;
            --yellow-bg: #ffe699;
            --orange-bg: #f8cbad;
            --border-color: #333;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; text-transform: uppercase; color: #2c3e50; margin-bottom: 25px; border-bottom: 2px solid var(--green-bg); pb: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; font-size: 14px; }
        th, td { border: 1px solid var(--border-color); padding: 6px; text-align: center; }
        
        .header-green { background-color: var(--green-bg); font-weight: bold; }
        .label-cell { text-align: left; padding-left: 15px; font-weight: 600; width: 150px; }
        .total-cell { background-color: #f9f9f9; font-weight: bold; width: 80px; }
        
        input[type="number"] {
            width: 100%; border: none; text-align: center; font-size: 15px; background: transparent; outline: none;
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* Bảng tổng kết bên phải */
        .summary-wrapper { display: flex; justify-content: flex-end; margin-top: 10px; }
        .summary-table { width: 250px; }
        
        /* Phần chi tiết lương bên dưới */
        .salary-section { margin-top: 30px; border-top: 2px dashed #ccc; pt: 20px; }
        .salary-table { width: 350px; margin: 0; }
        .salary-table td { text-align: right; padding: 8px 15px; }
        .salary-table .label-cell { text-align: left; }
        .final-row { background-color: #fff2cc; font-size: 1.1em; }
        .text-bold { font-weight: bold; }
        .text-red { color: #d9534f; font-weight: bold; }

        @media print {
            .container { box-shadow: none; border: none; }
            input { border: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Bảng Nhập Công & Chi Tiết Lương</h2>

    <div id="tables-container">
        </div>

    <div class="summary-wrapper">
        <table class="summary-table">
            <tr><td class="label-cell" style="background: var(--yellow-bg)">Thường</td><td id="final-thuong" class="text-bold">0</td></tr>
            <tr><td class="label-cell" style="background: var(--orange-bg)">OVT</td><td id="final-ovt" class="text-bold">0</td></tr>
            <tr><td class="label-cell" style="background: var(--yellow-bg)">CN</td><td id="final-cn" class="text-bold">0</td></tr>
        </table>
    </div>

    <div class="salary-section">
        <table class="salary-table">
            <tr><td class="label-cell">LCB</td><td id="val-lcb" class="text-bold">11,110,000</td></tr>
            <tr><td class="label-cell">Lương giờ</td><td id="val-luong-gio">53,413</td></tr>
            <tr><td class="label-cell">Thêm giờ (OVT x1.5)</td><td id="val-them-gio" class="text-bold">0</td></tr>
            <tr><td class="label-cell">PC chức vụ</td><td><input type="number" id="pc-chuc-vu" value="1600000" oninput="calculateAll()"></td></tr>
            <tr><td class="label-cell">PC công việc</td><td><input type="number" id="pc-cong-viec" value="750000" oninput="calculateAll()"></td></tr>
            <tr><td class="label-cell">PC thâm niên</td><td><input type="number" id="pc-tham-nien" value="590000" oninput="calculateAll()"></td></tr>
            <tr style="border: none;"><td colspan="2" style="border: none; height: 15px;"></td></tr>
            <tr><td class="label-cell">BHXH (8%)</td><td id="val-bhxh" style="color: #777;">0</td></tr>
            <tr><td class="label-cell">BHYT (1.5%)</td><td id="val-bhyt" style="color: #777;">0</td></tr>
            <tr><td class="label-cell">BHTN (1%)</td><td id="val-bhtn" style="color: #777;">0</td></tr>
            <tr style="border: none;"><td colspan="2" style="border: none; height: 15px;"></td></tr>
            <tr class="final-row">
                <td class="label-cell text-bold">Thực nhận</td>
                <td id="val-thuc-nhan" class="text-red">0</td>
            </tr>
        </table>
    </div>
</div>

<script>
    const daysInMonth = 31;
    const lcb = 11110000;
    const gioChuanThang = 208; // 26 ngày * 8 tiếng

    // Khởi tạo bảng 5 tuần
    function initTables() {
        const container = document.getElementById('tables-container');
        let dayCounter = 1;
        
        for (let w = 1; w <= 5; w++) {
            let tableHtml = `<table><tr class="header-green"><td style="width:150px"></td><td>CN</td><td></td><td></td><td></td><td></td><td></td><td>T7</td><td rowspan="2" class="total-cell">TỔNG</td></tr><tr class="header-green"><td>Ngày</td>`;
            
            for (let i = 0; i < 7; i++) {
                tableHtml += `<td>${dayCounter <= daysInMonth ? dayCounter : ''}</td>`;
                dayCounter++;
            }
            dayCounter -= 7; // Reset để điền input
            
            tableHtml += `</tr><tr><td class="label-cell">Thường</td>`;
            for (let i = 0; i < 7; i++) {
                tableHtml += `<td>${dayCounter <= daysInMonth ? `<input type="number" class="thuong" oninput="calculateAll()">` : ''}</td>`;
                dayCounter++;
            }
            tableHtml += `<td id="sum-thuong-w${w}" class="total-cell">0</td></tr>`;
            
            dayCounter -= 7;
            tableHtml += `<tr><td class="label-cell">OVT</td>`;
            for (let i = 0; i < 7; i++) {
                tableHtml += `<td>${dayCounter <= daysInMonth ? `<input type="number" class="ovt" oninput="calculateAll()">` : ''}</td>`;
                dayCounter++;
            }
            tableHtml += `<td id="sum-ovt-w${w}" class="total-cell">0</td></tr></table>`;
            
            container.innerHTML += tableHtml;
            if (dayCounter > daysInMonth) break;
        }
    }

    function calculateAll() {
        let grandThuong = 0;
        let grandOvt = 0;

        // Tính tổng từng tuần
        for (let w = 1; w <= 5; w++) {
            let weekThuong = 0;
            let weekOvt = 0;
            const table = document.getElementsByTagName('table')[w-1];
            if(!table) continue;

            table.querySelectorAll('.thuong').forEach(input => weekThuong += Number(input.value) || 0);
            table.querySelectorAll('.ovt').forEach(input => weekOvt += Number(input.value) || 0);
            
            const st = document.getElementById(`sum-thuong-w${w}`);
            const so = document.getElementById(`sum-ovt-w${w}`);
            if(st) st.innerText = weekThuong;
            if(so) so.innerText = weekOvt;

            grandThuong += weekThuong;
            grandOvt += weekOvt;
        }

        // Cập nhật bảng tổng kết
        document.getElementById('final-thuong').innerText = grandThuong;
        document.getElementById('final-ovt').innerText = grandOvt;

        // Logic tính lương
        const luongGio = Math.round(lcb / gioChuanThang);
        const tienOvt = Math.round(grandOvt * luongGio * 1.5);
        
        const pcChucVu = Number(document.getElementById('pc-chuc-vu').value) || 0;
        const pcCongViec = Number(document.getElementById('pc-cong-viec').value) || 0;
        const pcThamNien = Number(document.getElementById('pc-tham-nien').value) || 0;

        const bhxh = Math.round(lcb * 0.08);
        const bhyt = Math.round(lcb * 0.015);
        const bhtn = Math.round(lcb * 0.01);

        const thucNhan = (lcb + tienOvt + pcChucVu + pcCongViec + pcThamNien) - (bhxh + bhyt + bhtn);

        // Hiển thị số liệu định dạng VNĐ
        document.getElementById('val-luong-gio').innerText = luongGio.toLocaleString();
        document.getElementById('val-them-gio').innerText = tienOvt.toLocaleString();
        document.getElementById('val-bhxh').innerText = bhxh.toLocaleString();
        document.getElementById('val-bhyt').innerText = bhyt.toLocaleString();
        document.getElementById('val-bhtn').innerText = bhtn.toLocaleString();
        document.getElementById('val-thuc-nhan').innerText = thucNhan.toLocaleString() + " ₫";
    }

    window.onload = () => {
        initTables();
        calculateAll();
    };
</script>

</body>
</html>
